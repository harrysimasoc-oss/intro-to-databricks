bundle:
  name: intro-to-bundles

variables:
  warehouse_id: 
    lookup: 
      warehouse: "Serverless Starter Warehouse"
  catalog:
    default: main
  schema:
    default: dbdemos_pipeline_bike

resources:    
  dashboards:
    bike_dashboard:
      display_name: Bike Sharing Analytics
      file_path: ./dashboards/Bike Sharing Analytics.lvdash.json
      warehouse_id: ${var.warehouse_id}
      dataset_catalog: ${var.catalog}
      dataset_schema: ${var.schema}
      permissions:
        - level: CAN_RUN
          group_name: trainees

targets:
  dev:
    default: true
    mode: development
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
  tst:
    default: false
    mode: production
    git:
      branch: main
    workspace:
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
  prd:
    default: false
    mode: production
    git:
      branch: main
    workspace:
      root_path: /Workspace/Shared/${bundle.name}