bundle:
  name: intro-to-bundles

include:
  - './dashboards/**'

resources:    
  dashboards:
    test-dashboard:
      display_name: test-dashboard-ha
      warehouse_id: ${var.warehouse_id}
      permissions:
        - level: CAN_RUN
          group_name: trainees

variables:
  warehouse_id: 
    description: Default SQL Warehouse
    default: 55e74e151b707f52

targets:
  dev:
    default: true
    mode: development
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
  tst:
    default: false
    workspace:
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
  prd:
    default: false
    workspace:
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}